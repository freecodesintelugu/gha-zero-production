name: Python CI Pipiline
on:
  push:
jobs:
  python_pipeline:
    runs-on: ubuntu-22.04
    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v7.1.0
      with: 
        python-version: '3.12'
    - name: Run Test
      run: python -m unittest discover -s test.*.py -v
    
    
      
