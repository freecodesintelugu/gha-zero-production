  workflow_dispatch: 
    inputs:
      deployment_target:
       description: "Choose a demo target"
       required: true
       type: choice
       options:
         - staging
         - production
permissions: 
  contents: read
env:
  APP_NAME: sample_app
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sample_ci_pipeline:
#    env:
