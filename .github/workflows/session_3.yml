#EXPRESSIONS
name: expression demo
on: push
env:
  APP_NAME: demo-app
jobs:
  demo:
    runs-on: ubuntu-slim
    steps:
      - name: show event and branch
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo '"Actor: ${{ github.actor }}"'
      - name: Run only on main
        if: "${{ github.ref == 'refs/heads/main' }}"
        run: echo "Main branch detected"
#context 
  context:
    runs-on: ubuntu-latest
    steps:
      - name: Display Github and context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "APP: $APP_NAME"
      - name: use repo variable
        env:
          DEPLOY_REGION: ${{ vars.DEPLOY_REGION }}
        run: 'echo "Region: $DEPLOY_REGION"'
      - name: check secret safely
        env:
          API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then
            echo "API token is configuerd"
          else
            echo "API token is not configured "
          fi
# steps , needs , matrix , runner
  prepare:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.meta.outputs.label }}
    steps:
      - name: Create output
        id: meta
        run: echo "label=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Disply context vaules
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Build label: ${{ needs.prepare.outputs.label }}"
          echo "python: ${{ matrix.python-version }}"
        

      
